<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <mask id="geometry-gap-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="100" height="100">
      <rect width="100" height="100" fill="#ffffff" />            
      <path 
        d="M -10 -4 L 50 56 L 110 -4" 
        fill="none" 
        stroke="#000000" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
      />
    </mask>
  </defs>
  
  <!-- Changed stroke back to black for visibility on light backgrounds -->
  <g fill="none" stroke="black" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Vertical pillars -->
    <g mask="url(#geometry-gap-mask)">
      <line x1="20" y1="26" x2="20" y2="80" />
      <line x1="80" y1="26" x2="80" y2="80" />
    </g>
    
    <!-- Visible foreground chevron -->
    <path d="M 20 26 L 50 56 L 80 26" />
  </g>
</svg>
